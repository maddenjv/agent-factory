# Two things live here:
#   dolt  - the single Beads database server all agents share (server mode = concurrent writers)
#   agent - the image every role runs; started per-role by bin/start.sh via `docker compose run`.
#           Built from this repo's own Dockerfile (Claude Code CLI, beads, git, jq - see
#           docs/ARCHITECTURE.md). The Dockerfile's own default (a plain shell, no entrypoint
#           behavior of its own) is overridden below with agent-loop.sh, the headless polling
#           loop these containers run.
#           agent-loop.sh does its own host-~/.claude sync (see .claude-host mount below) so each
#           role reuses your logged-in Claude Code plan session without an API key or OAuth token.
#
# Always invoked via bin/lib.sh's `dc` (docker compose -f <this file>), never by `cd`-ing here
# first: KIT_DIR (this repo) and PROJECT_DIR (the project agent-factory is pointed at - wherever
# you `cd`'d before running bin/start.sh etc.) are two DIFFERENT directories, both passed in as
# env vars and mounted at their own real host paths. All of agent-factory's own runtime state
# (workspaces, control, logs, claude config, the dolt db) lives under PROJECT_DIR/.agent-factory,
# so it travels with the project instead of being buried inside this kit - see bin/lib.sh.
name: agent-factory
services:
  dolt:
    image: dolthub/dolt-sql-server:latest
    container_name: factory-dolt
    restart: unless-stopped
    # dolthub/dolt-sql-server runs as root by default, so without this every file it writes into
    # the bind mount below would be root-owned on the host - not removable from your own terminal
    # without sudo. Running as your own uid/gid avoids that; HOME must then point somewhere that
    # uid can actually write (root's home, "/", isn't), since dolt keeps a small global config
    # there too, alongside its per-project data.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DOLT_ROOT_HOST: "%"          # allow root from other containers, and from the loopback
                                    # publish below; still has no password (see README)
      HOME: /var/lib/dolt
    volumes:
      - ${PROJECT_DIR}/.agent-factory/dolt:/var/lib/dolt
    ports:
      # Loopback only (not your LAN) - lets `bd` run from your own host shell in PROJECT_DIR,
      # not just from inside a container pane. bin/init-project.sh points a fresh project's
      # .beads/metadata.json at 127.0.0.1 for exactly this; agent-loop.sh/env.sh override it
      # back to the Docker-internal "dolt" hostname for containers via BEADS_DOLT_SERVER_HOST.
      - "127.0.0.1:${DOLT_HOST_PORT:-3306}:3306"
    networks: [factory]

  agent:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: factory-agent:latest
    entrypoint: ["bash", "${KIT_DIR}/bin/agent-loop.sh"]
    working_dir: ${PROJECT_DIR}
    profiles: ["agents"]
    env_file: .env
    environment:
      ROLE: ${ROLE:-shell}
      KIT_DIR: ${KIT_DIR}
      PROJECT_DIR: ${PROJECT_DIR}
    init: true
    depends_on: [dolt]
    networks: [factory]
    volumes:
      # This kit: read-only. Nothing that runs in a container needs to modify its own
      # orchestration scripts or prompts.
      - ${KIT_DIR}:${KIT_DIR}:ro
      # The real project: read-write, at the identical host path. Every role clones from and
      # works in a copy of this under .agent-factory/workspaces/<role>; only the reviewer's
      # merge-to-main push touches this checkout directly (see bin/init.sh's updateInstead).
      - ${PROJECT_DIR}:${PROJECT_DIR}
      # CONTAINER_HOME is populated into .env by bin/init.sh (mirroring HOST_UID/HOST_GID) and
      # must match the image's actual account home - see bin/init.sh and agent-loop.sh's own
      # comment on sync_configs() for why the default can't just be changed freely.
      - ${PROJECT_DIR}/.agent-factory/claude/${ROLE:-shell}:${CONTAINER_HOME:-/home/john}/.claude
      - ${HOME}/.claude:${CONTAINER_HOME:-/home/john}/.claude-host:ro
      - ai-dev-kit:${CONTAINER_HOME:-/home/john}/.ai-dev-kit
      - ${HOME}/.ai-dev-kit:${CONTAINER_HOME:-/home/john}/.ai-dev-kit-host:ro
      - agents-home:${CONTAINER_HOME:-/home/john}/.agents
      - ${HOME}/.agents:${CONTAINER_HOME:-/home/john}/.agents-host:ro
    # Container hardening: no docker socket, no ~/.ssh, no other home-dir contents. The
    # deliberate exceptions above are ~/.claude, ~/.ai-dev-kit and ~/.agents, each mounted
    # read-only so agent-loop.sh can copy them into this role's own writable volume/config at
    # startup (same pattern an interactive `claude` entrypoint would use for a login session).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 6g

volumes:
  ai-dev-kit: {}
  agents-home: {}

networks:
  factory: {}
